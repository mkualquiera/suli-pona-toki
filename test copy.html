<html>

<head>
    <style>
        /* Base styling for all tags - using inline-block instead of block */
        sentence,
        context,
        subject,
        verb,
        object,
        apposition,
        preposition {
            display: inline-block;
            position: relative;
            font-family: monospace;
            vertical-align: middle;
        }
    </style>
</head>

<body>
    <Sentence>
        <Context>
            <Sentence>
                <Subject>sina </Subject>
                <Verb><Object>soweli </Object> moku </Verb>
            </Sentence>
        </Context>
        <Subject>, mi </Subject>
        <Verb>
            <Preposition class=\"Origin\">ni </Preposition> <Object>sina </Object> moli
        </Verb>
        <Apposition>
            <Sentence>
                <Subject>mi </Subject>
                <Verb>kasi moku pi jan </Verb>
            </Sentence>
        </Apposition>
    </Sentence>
</body>

</html>
